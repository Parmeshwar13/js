<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<ul class="language">
    <li>Javascript</li>
</ul>    

<script>
    function AddLang(language){
        const li=document.createElement("li")
        li.innerText=`${language}`
        document.querySelector('.language').appendChild(li)
    }
    AddLang("Python")
    AddLang("Django")
   function AddOption(language){
        const li=document.createElement("li")
        li.appendChild(document.createTextNode(`${language}`))
        document.querySelector('.language').appendChild(li)

   }
   AddOption("Golang")
   //EDIT
   const Second_child=document.querySelector("li:nth-child(2)")
    Second_child.innerText="Magenta"   

    //Second  Approach
    const first_child=document.querySelector("li:first-child")
    const newli=document.createElement('li')
    newli.innerHTML='TypeScript'
    first_child.replaceWith(newli)
    // //REMOVE
    const last_child=document.querySelector("li:last-child")
    last_child.remove()


      
</script>
</body>
</html>
